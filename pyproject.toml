[project]
name = "blog-app"
version = "0.1.0"
description = "Blog app to learn fastapi"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "imagekitio>=5.10.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
